services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    depends_on: [redis, postgres]

  worker:
    build: ./workers
    env_file: ./backend/.env
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: klark
      POSTGRES_PASSWORD: klark_dev
    ports: ["5432:5432"]